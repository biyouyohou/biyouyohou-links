<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美容予報｜商品リンクページの移転</title>
  <meta name="robots" content="noindex">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fbf9f5;color:#29241f;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.8}main{max-width:640px;margin:12vh auto;padding:40px 26px;background:white;border:1px solid #e9e1d5;border-radius:22px}small{color:#96794e;letter-spacing:.15em}h1{font-size:26px;line-height:1.5}a{display:block;background:#927244;color:white;padding:14px 20px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700}.note{font-size:14px;color:#746b60}@media(max-width:680px){main{margin:8vh 18px}}
  </style>
</head>
<body>
  <main>
    <small>BEAUTY FORECAST</small>
    <p>美容予報</p>
    <h1>商品リンクページは移転しました</h1>
    <p>ショート動画・長尺動画で紹介した商品のリンクは、新しいページでご覧いただけます。</p>
    <a id="new-page" href="https://biyouyohou-links.ruri-25-joshido.workers.dev/">新しい商品リンクページを開く</a>
    <p class="note">まもなく新しいページへ移動します。ブックマークの更新をお願いします。</p>
  </main>
  <script>
    const destination = new URL('https://biyouyohou-links.ruri-25-joshido.workers.dev/');
    destination.search = location.search;
    destination.hash = location.hash;
    document.getElementById('new-page').href = destination.href;
    setTimeout(() => location.replace(destination.href), 1500);
  </script>
</body>
</html>
