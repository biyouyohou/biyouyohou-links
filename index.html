<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F3EC">
  <meta name="description" content="美容予報が紹介した新作コスメ・スキンケアの商品リンク一覧です。">
  <title>美容予報｜紹介した新作</title>
  <style>
    :root { color-scheme: light; --ivory:#F7F3EC; --ink:#44372F; --coral:#C77E73; --line:#DCCFC3; --muted:#756A62; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--ivory); color:var(--ink); font-family:"Yu Gothic UI","Meiryo",sans-serif; }
    main { width:min(100% - 32px, 620px); margin:0 auto; padding:32px 0 56px; }
    header { border-bottom:1px solid var(--line); padding:8px 0 18px; }
    .brand-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 0 10px; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0; color:var(--coral); font-size:.7rem; font-weight:700; letter-spacing:.16em; }
    .brand-name { margin:0; font-size:.9rem; font-weight:700; letter-spacing:.08em; }
    h1 { margin:16px 0 0; font-size:clamp(2rem,8vw,3rem); line-height:1.2; letter-spacing:.02em; }
    .intro { margin:14px 0 0; color:var(--muted); line-height:1.7; font-size:.92rem; }
    .disclosure { margin:18px 0 22px; padding:12px 14px; border-left:3px solid var(--coral); background:#fffaf5; font-size:.84rem; line-height:1.65; }
    h2 { margin:28px 0 12px; font-size:1rem; }
    .product { margin:12px 0; padding:18px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 3px 12px #44372f0b; }
    .date { color:var(--coral); font-size:.8rem; font-weight:700; }
    .product h3 { margin:7px 0; font-size:1.12rem; line-height:1.45; }
    .summary { margin:8px 0 14px; color:var(--muted); font-size:.9rem; line-height:1.7; white-space:pre-line; }
    .links { display:flex; flex-wrap:wrap; gap:9px; }
    .links a { display:inline-block; padding:10px 14px; border-radius:999px; background:var(--ink); color:#fff; text-decoration:none; font-size:.84rem; font-weight:700; }
    .links a.secondary { background:var(--coral); }
    .empty { padding:20px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); text-align:center; line-height:1.7; }
    footer { margin-top:30px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:.75rem; line-height:1.7; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand-row">
        <p class="eyebrow">BEAUTY FORECAST</p>
        <p class="brand-name">美容予報</p>
      </div>
      <h1>紹介した新作</h1>
      <p class="intro">動画で紹介したスキンケア・コスメの情報と商品リンクをまとめています。</p>
    </header>
    <p class="disclosure">広告・アフィリエイトリンクを含みます。</p>
    <section aria-labelledby="list-title">
      <h2 id="list-title">商品リンク</h2>
      <p class="empty" id="empty-state">現在掲載できる商品はありません。確認済みの商品リンクが準備でき次第、こちらに掲載します。</p>
    </section>
    <footer>商品情報・価格・在庫・販売状況は変更されることがあります。リンク先の表示をご確認のうえご利用ください。<br>美容予報</footer>
  </main>
</body>
</html>
